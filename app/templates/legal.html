{% extends "base.html" %}
{% block title %}{{ doc.title }} – {{ cfg.SITE_NAME }}{% endblock %}
{% block description %}{{ doc.title }} for {{ cfg.SITE_NAME }}.{% endblock %}
{% block main %}
<section class="section">
  <div class="wrap wrap--narrow prose">
    <h1>{{ doc.title }}</h1>
    {% for para in doc.body %}<p>{{ para|site }}</p>{% endfor %}
  </div>
</section>
{% endblock %}
